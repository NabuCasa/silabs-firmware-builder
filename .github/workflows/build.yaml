name: Build firmwares

on:
  pull_request:
    paths-ignore:
      - '.gitignore'
      - 'README.md'
  push:
    paths-ignore:
      - '.gitignore'
      - 'README.md'
  release:
    types:
      - published

env:
  REGISTRY: ghcr.io

permissions: {}

jobs:
  run-pre-commit:
    name: Run pre-commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install pre-commit
        run: |
          pip install pre-commit
          pre-commit install
      - name: Run pre-commit
        run: |
          pre-commit run --show-diff-on-failure --color=always --all-files

  check-container:
    name: Check if container build needed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag_name: ${{ steps.read-repo-info.outputs.tag_name }}
      image_name: ${{ steps.read-repo-info.outputs.image_name }}
      container_name: ${{ steps.read-repo-info.outputs.container_name }}
      build_image: ${{ steps.read-repo-info.outputs.build_image }}
      build_matrix: ${{ steps.read-repo-info.outputs.build_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to the GitHub container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Read repository information
        id: read-repo-info
        run: |
          if [[ $GITHUB_EVENT_NAME == "pull_request" ]]; then
            base_image=$(echo ${GITHUB_EVENT_PULL_REQUEST_BASE_REPO_FULL_NAME} | awk '{print tolower($0)}')
            head_image=$(echo ${GITHUB_EVENT_PULL_REQUEST_HEAD_REPO_FULL_NAME} | awk '{print tolower($0)}')
          else
            base_image=$(echo ${{ github.repository }} | awk '{print tolower($0)}')
            head_image=$(echo ${{ github.repository }} | awk '{print tolower($0)}')
          fi

          tag_name=$(echo "${{ hashFiles('Dockerfile', 'uv.lock') }}" | cut -c-16)

          # Default to building a new container under the original repo
          image_name=$head_image
          build_image=true

          # Check if we can use the base image (Nabu Casa)
          if docker manifest inspect ${{ env.REGISTRY }}/$base_image:$tag_name; then
            image_name=$base_image
            build_image=false
          fi

          # Check if we can use the head image (if this is a PR)
          if [[ $base_image != $head_image ]]; then
            if docker manifest inspect ${{ env.REGISTRY }}/$head_image:$tag_name; then
              image_name=$head_image
              build_image=false
            fi
          fi

          if [[ $build_image == "true" && $GITHUB_EVENT_NAME == "pull_request" ]]; then
            echo "Cannot build a new container within a PR. Please re-run this action after $head_image:$tag_name is built."
            exit 1
          fi

          echo "build_image=$build_image" >> $GITHUB_OUTPUT
          echo "tag_name=$tag_name" >> $GITHUB_OUTPUT
          echo "image_name=$image_name" >> $GITHUB_OUTPUT
          echo "container_name=${{ env.REGISTRY }}/$image_name:$tag_name" >> $GITHUB_OUTPUT

          if [[ "$build_image" == "true" ]]; then
            echo 'build_matrix=[{"arch":"amd64","runner":"ubuntu-24.04"},{"arch":"arm64","runner":"ubuntu-24.04-arm"}]' >> $GITHUB_OUTPUT
          else
            echo 'build_matrix=[{"arch":"skipped","runner":"ubuntu-latest"}]' >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_EVENT_PULL_REQUEST_BASE_REPO_FULL_NAME: ${{ github.event.pull_request.base.repo.full_name }}
          GITHUB_EVENT_PULL_REQUEST_HEAD_REPO_FULL_NAME: ${{ github.event.pull_request.head.repo.full_name }}

  build-container:
    name: Build container (${{ matrix.arch }})
    needs: check-container
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include: ${{ fromJson(needs.check-container.outputs.build_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: matrix.arch != 'skipped'
        with:
          persist-credentials: false
      - name: Log in to the GitHub container registry
        if: matrix.arch != 'skipped'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        if: matrix.arch != 'skipped'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Free up disk space
        if: matrix.arch != 'skipped'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h
      - name: Build and Push
        if: matrix.arch != 'skipped'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          tags: ${{ env.REGISTRY }}/${{ needs.check-container.outputs.image_name }}:${{ needs.check-container.outputs.tag_name }}-${{ matrix.arch }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ needs.check-container.outputs.image_name }}:cache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ needs.check-container.outputs.image_name }}:cache-${{ matrix.arch }},mode=max
          outputs: type=image,compression=zstd,compression-level=19,force-compression=true,push=true

  merge-container:
    name: Create multi-arch manifest
    needs: [check-container, build-container]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    outputs:
      container_name: ${{ needs.check-container.outputs.container_name }}
    steps:
      - name: Log in to the GitHub container registry
        if: needs.check-container.outputs.build_image == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        if: needs.check-container.outputs.build_image == 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Create and push manifest
        if: needs.check-container.outputs.build_image == 'true'
        run: |
          docker buildx imagetools create -t ${{ env.REGISTRY }}/${NEEDS_CHECK_CONTAINER_OUTPUTS_IMAGE_NAME}:${NEEDS_CHECK_CONTAINER_OUTPUTS_TAG_NAME} \
            ${{ env.REGISTRY }}/${NEEDS_CHECK_CONTAINER_OUTPUTS_IMAGE_NAME}:${NEEDS_CHECK_CONTAINER_OUTPUTS_TAG_NAME}-amd64 \
            ${{ env.REGISTRY }}/${NEEDS_CHECK_CONTAINER_OUTPUTS_IMAGE_NAME}:${NEEDS_CHECK_CONTAINER_OUTPUTS_TAG_NAME}-arm64
        env:
          NEEDS_CHECK_CONTAINER_OUTPUTS_IMAGE_NAME: ${{ needs.check-container.outputs.image_name }}
          NEEDS_CHECK_CONTAINER_OUTPUTS_TAG_NAME: ${{ needs.check-container.outputs.tag_name }}
      - name: Tag with ref name
        if: needs.check-container.outputs.build_image == 'true'
        run: |
          REF_TAG=$(echo "${GITHUB_REF_NAME}" | sed 's/[^a-zA-Z0-9._-]/-/g')
          docker buildx imagetools create -t ${{ env.REGISTRY }}/${NEEDS_CHECK_CONTAINER_OUTPUTS_IMAGE_NAME}:${REF_TAG} \
            ${{ env.REGISTRY }}/${NEEDS_CHECK_CONTAINER_OUTPUTS_IMAGE_NAME}:${NEEDS_CHECK_CONTAINER_OUTPUTS_TAG_NAME}
        env:
          NEEDS_CHECK_CONTAINER_OUTPUTS_IMAGE_NAME: ${{ needs.check-container.outputs.image_name }}
          NEEDS_CHECK_CONTAINER_OUTPUTS_TAG_NAME: ${{ needs.check-container.outputs.tag_name }}
      - name: Tag as latest
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && needs.check-container.outputs.build_image == 'true'
        run: |
          docker buildx imagetools create -t ${{ env.REGISTRY }}/${NEEDS_CHECK_CONTAINER_OUTPUTS_IMAGE_NAME}:latest \
            ${{ env.REGISTRY }}/${NEEDS_CHECK_CONTAINER_OUTPUTS_IMAGE_NAME}:${NEEDS_CHECK_CONTAINER_OUTPUTS_TAG_NAME}
        env:
          NEEDS_CHECK_CONTAINER_OUTPUTS_IMAGE_NAME: ${{ needs.check-container.outputs.image_name }}
          NEEDS_CHECK_CONTAINER_OUTPUTS_TAG_NAME: ${{ needs.check-container.outputs.tag_name }}



  list-manifests:
    name: List firmware manifests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: set-matrix
        run: |
          echo "matrix=$(find manifests -type f \( -name "*.yaml" -o -name "*.yml" \) -print | sort | jq -R -s -c 'split("\n")[:-1]')" >> $GITHUB_OUTPUT

  build-firmwares:
    name: Firmware builder
    needs: [list-manifests, merge-container]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      # Tag is the hash of the Dockerfile and uv.lock, built by this workflow
      image: ${{ needs.merge-container.outputs.container_name }} # zizmor: ignore[unpinned-images]
      options: --user root
    strategy:
      matrix:
        manifest: ${{ fromJson(needs.list-manifests.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build firmware
        id: build-firmware
        run: |
          /opt/venv/bin/python3 -m tools.build_project \
            --manifest "${MATRIX_MANIFEST}" \
            --build-dir build \
            --output-dir outputs \
            --output gbl \
            --output hex \
            --output out

          # Get the basename of the GBL in `outputs`
          output_basename=$(basename -- $(basename -- $(ls -1 outputs/*.gbl | head -n 1)) .gbl)
          echo "output_basename=$output_basename" >> $GITHUB_OUTPUT
        env:
          MATRIX_MANIFEST: ${{ matrix.manifest }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firmware-build-${{ steps.build-firmware.outputs.output_basename }}
          path: outputs/*
          compression-level: 9
          if-no-files-found: error

  generate-manifest:
    name: Generate manifest
    needs: [merge-container, build-firmwares]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      # Tag is the hash of the Dockerfile and uv.lock, built by this workflow
      image: ${{ needs.merge-container.outputs.container_name }} # zizmor: ignore[unpinned-images]
      options: --user root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all workflow artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
          pattern: firmware-build-*

      - name: Generate manifest
        run: |
          /opt/venv/bin/python3 tools/create_manifest.py artifacts src > artifacts/manifest.json

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manifest
          path: artifacts/manifest.json
          compression-level: 9
          if-no-files-found: error

  release-assets:
    name: Upload release assets
    needs: [generate-manifest]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
          pattern: manifest

      - name: Download all workflow artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
          pattern: firmware-build-*

      - name: Upload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          gh release upload "${GITHUB_EVENT_RELEASE_TAG_NAME}" \
            --repo "${{ github.repository }}" \
            --clobber \
            artifacts/*.gbl \
            artifacts/manifest.json

  sync-releases-branch:
    name: Sync releases branch
    needs: [release-assets]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Credentials are intentionally persisted: the last step pushes back to the
      # `releases` branch. Nothing here is uploaded as an artifact.
      - name: Checkout releases branch # zizmor: ignore[artipacked]
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: releases
          path: releases_branch

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          mkdir -p artifacts_release
          sleep 10
          gh release download "${GITHUB_EVENT_RELEASE_TAG_NAME}" \
            --repo "${{ github.repository }}" \
            --dir artifacts_release \
            --clobber

      - name: Sync files for release tag
        run: |
          set -euo pipefail
          tag="${GITHUB_EVENT_RELEASE_TAG_NAME}"
          target="releases_branch/${tag}"
          mkdir -p "$target"
          find "$target" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a artifacts_release/. "$target/"
        env:
          GITHUB_EVENT_RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}

      - name: Commit and push changes
        run: |
          set -euo pipefail
          cd releases_branch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${GITHUB_EVENT_RELEASE_TAG_NAME}"
          git commit --allow-empty -m "Sync release assets for ${GITHUB_EVENT_RELEASE_TAG_NAME}"
          git pull --rebase origin releases
          git push origin HEAD:releases
        env:
          GITHUB_EVENT_RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
