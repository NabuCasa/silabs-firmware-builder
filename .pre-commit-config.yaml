repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: cargo-fmt
        name: Cargo fmt
        entry: sh -c 'cd crates && cargo fmt --all'
        language: system
        types: [rust]
        pass_filenames: false
