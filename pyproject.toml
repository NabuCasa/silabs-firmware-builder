[project]
name = "silabs-firmware-builder"
version = "1.0.0"
requires-python = ">=3.14"
dependencies = [
    "ruamel.yaml",
    "pyelftools",
    "pygbl[all]>=1.2.0",
]

[dependency-groups]
simulation = [
    "bellows",
    "pytest",
    "pytest-asyncio",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
