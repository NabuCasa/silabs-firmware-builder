[package]
name = "zbt2_reset_button"
edition.workspace = true
version.workspace = true

[features]
# Reset with sl_zigbee_token_factory_reset, which keeps the frame counters
zigbee_token_reset = []

# Components this crate uses come from the slcc's `requires`
[dependencies]
critical-section = "1"

[build-dependencies]
ohf-bindgen = { path = "../ohf-bindgen" }
ohf-config = { path = "../ohf-config" }
