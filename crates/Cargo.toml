[workspace]
resolver = "2"
members = [
    "ohf-bindgen",
    "ohf-config",
    "ohf-sys",
    "ohf-rt",
    "ohf-ws2812",
    "ohf-qma6100p",
    "ohf-led-effects",
    "ohf-led-effects-zigbee",
    "ohf-led-effects-openthread",
    "ohf-xncp",
    "ohf-xncp-macros",
    "ohf-xncp-common",
    "ohf-xncp-zbt2",
    "ohf-ncp-dlk-policy",
    "ohf-zbt2-reset-button",
    "ohf-zbt2-router",
    "ohf-router",
    "ohf-firmware",
]

[workspace.package]
edition = "2021"
version = "0.1.0"

[profile.release]
panic = "abort"
opt-level = "z"
# The firmware link does LTO across C and Rust. rustc's own LTO output carries no
# summary, which LLD treats as an unsplit LTO unit.
lto = false
codegen-units = 1
strip = true
debug = false

[profile.dev]
panic = "abort"
