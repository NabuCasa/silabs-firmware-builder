[package]
name = "ohf-firmware"
edition.workspace = true
version.workspace = true

[lib]
# The single staticlib linked into the firmware: it pulls in the component rlibs and
# provides the one #[panic_handler], so core/the handler appear exactly once.
crate-type = ["staticlib"]

# Each component is an optional dep behind a feature whose name matches the component's
# `ohf_rust_feature` slcc contribution. SLC renders the enabled set (autogen/
# ohf_rust_features.txt); build_project.py passes it as --features. SLC selects; cargo
# follows. Adding a component = a crate here + its feature + the slcc contribution.
[dependencies]
ohf-rt = { path = "../ohf-rt" }
ohf-ws2812 = { path = "../ohf-ws2812", optional = true }
ohf-qma6100p = { path = "../ohf-qma6100p", optional = true }
ohf-led-effects = { path = "../ohf-led-effects", optional = true }
ohf-led-effects-zigbee = { path = "../ohf-led-effects-zigbee", optional = true }
ohf-led-effects-openthread = { path = "../ohf-led-effects-openthread", optional = true }
ohf-xncp = { path = "../ohf-xncp", optional = true }
ohf-xncp-common = { path = "../ohf-xncp-common", optional = true }
ohf-xncp-zbt2 = { path = "../ohf-xncp-zbt2", optional = true }
ohf-ncp-dlk-policy = { path = "../ohf-ncp-dlk-policy", optional = true }
ohf-zbt2-reset-button = { path = "../ohf-zbt2-reset-button", optional = true }
ohf-router = { path = "../ohf-router", optional = true }

[features]
ws2812 = ["dep:ohf-ws2812"]
qma6100p = ["dep:ohf-qma6100p"]
led_effects = ["dep:ohf-led-effects"]
led_effects_zigbee = ["dep:ohf-led-effects-zigbee"]
led_effects_openthread = ["dep:ohf-led-effects-openthread"]
xncp_core = ["dep:ohf-xncp"]
xncp_common = ["dep:ohf-xncp-common"]
xncp_zbt2 = ["dep:ohf-xncp-zbt2"]
ncp_dlk_policy = ["dep:ohf-ncp-dlk-policy"]
zbt2_reset_button = ["dep:ohf-zbt2-reset-button"]
# Router-only: switches the reset backend to the frame-counter-preserving zigbee token reset.
zbt2_reset_button_zigbee_token = ["zbt2_reset_button", "ohf-zbt2-reset-button/zigbee_token_reset"]
router_beacon_filter = ["dep:ohf-router", "ohf-router/beacon_filter"]
router_eui64_unique = ["dep:ohf-router", "ohf-router/eui64_unique"]
router_nvram_reset = ["dep:ohf-router", "ohf-router/nvram_reset"]
router_install_code = ["dep:ohf-router", "ohf-router/install_code"]
