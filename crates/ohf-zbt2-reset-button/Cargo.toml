[package]
name = "ohf-zbt2-reset-button"
edition.workspace = true
version.workspace = true

[features]
# Reset with sl_zigbee_token_factory_reset, which keeps the frame counters
zigbee_token_reset = []

[dependencies]
ohf-sys = { path = "../ohf-sys", features = ["factory_erase"] }
ohf-led-effects = { path = "../ohf-led-effects" }
critical-section = "1"

[build-dependencies]
ohf-bindgen = { path = "../ohf-bindgen" }
ohf-config = { path = "../ohf-config" }
